services:
  - type: web
    name: setu-payment-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: setu-payment-db
          property: connectionString
      - key: API_KEY
        sync: false          # set this yourself in the Render dashboard, not committed here
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: UNSETTLED_THRESHOLD_HOURS
        value: "24"

databases:
  - name: setu-payment-db
    plan: free
    databaseName: setu
    user: setu
