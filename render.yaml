services:
  - type: web
    name: setu-payment-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: setu-payment-db
          property: connectionString
      - key: API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: UNSETTLED_THRESHOLD_HOURS
        value: "24"

databases:
  - name: setu-payment-db
    plan: free
    databaseName: setu
    user: setu
